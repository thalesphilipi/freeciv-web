<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soberania Emergente - Geopolitical Simulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            overflow: hidden;
        }

        /* Split Screen Layout */
        #game-container {
            flex: 3; /* 75% of the screen */
            position: relative;
            border-right: 2px solid #333;
            background-color: #000;
        }

        #freeciv-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Sidebar for Chat and Cabinet */
        #cabinet-sidebar {
            flex: 1; /* 25% of the screen */
            display: flex;
            flex-direction: column;
            background-color: #252526;
            min-width: 350px;
        }

        #sidebar-header {
            padding: 15px;
            background-color: #333337;
            text-align: center;
            border-bottom: 1px solid #444;
            font-weight: bold;
            font-size: 1.2em;
            letter-spacing: 1px;
            color: #dcdcaa;
        }

        /* Chat History Area */
        #chat-history {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Chat Message Bubbles */
        .message {
            max-width: 90%;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.4;
            position: relative;
        }

        .player-msg {
            align-self: flex-end;
            background-color: #005a9e; /* Player Blue */
            color: white;
            border-bottom-right-radius: 0;
        }

        .agent-msg {
            align-self: flex-start;
            background-color: #3c3c3c; /* Agent Gray */
            color: #cccccc;
            border-bottom-left-radius: 0;
            border-left: 3px solid #b5cea8; /* Highlight for agents */
        }

        .agent-name {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #569cd6;
        }

        .system-msg {
            align-self: center;
            background-color: transparent;
            color: #9cdcfe;
            font-style: italic;
            font-size: 0.85em;
            text-align: center;
            border: 1px dashed #555;
            padding: 5px 10px;
        }

        /* Input Area */
        #input-area {
            padding: 15px;
            background-color: #2d2d30;
            border-top: 1px solid #444;
            display: flex;
            gap: 10px;
        }

        #decree-input {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
            resize: none; /* Prevent manual resize for cleaner look, handle via JS if needed */
        }

        #decree-input:focus {
            outline: none;
            border-color: #007acc;
        }

        #send-btn {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #send-btn:hover {
            background-color: #1177bb;
        }

        /* Custom Scrollbar for Chat */
        #chat-history::-webkit-scrollbar {
            width: 8px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        #chat-history::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>

    <!-- Left Side: The Game World (Freeciv-web) -->
    <div id="game-container">
        <!-- Assuming Freeciv-web will run on port 8080 locally when started -->
        <!-- In a real deployment, this URL would be dynamic or point to the integrated server -->
        <iframe id="freeciv-iframe" src="http://localhost:8080" title="Freeciv World Map"></iframe>
    </div>

    <!-- Right Side: The Cabinet Interface -->
    <div id="cabinet-sidebar">
        <div id="sidebar-header">
            GABINETE EXECUTIVO<br>
            <span style="font-size: 0.7em; color: #888; font-weight: normal;">Tick: <span id="tick-counter">1</span> | Estabilidade: 50%</span>
        </div>

        <div id="chat-history">
            <div class="message system-msg">
                O ano é 4000 a.C. O mundo aguarda sua visão, Soberano.
            </div>
            <div class="message agent-msg">
                <div class="agent-name">Ministro da Defesa (Lealdade: 80, Medo: 20)</div>
                Senhor, nossas tribos estão unidas, mas vulneráveis. Devemos focar em estabelecer nossas fronteiras ou expandir agressivamente?
            </div>
            <!-- Future messages will be appended here dynamically -->
        </div>

        <div id="input-area">
            <textarea id="decree-input" rows="2" placeholder="Digite seu decreto ou pergunte algo ao gabinete... (Ex: 'Quero investir em exploração militar')"></textarea>
            <button id="send-btn">Emitir</button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const decreeInput = document.getElementById('decree-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, type, agentName = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);

            if (type === 'agent-msg' && agentName) {
                const nameDiv = document.createElement('div');
                nameDiv.classList.add('agent-name');
                nameDiv.textContent = agentName;
                msgDiv.appendChild(nameDiv);
            }

            // Allow basic text content for now. In a real app, handle safe HTML if formatting is needed.
            const contentSpan = document.createElement('span');
            contentSpan.textContent = text;
            msgDiv.appendChild(contentSpan);

            chatHistory.appendChild(msgDiv);

            // Auto-scroll to bottom
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleSend() {
            const text = decreeInput.value.trim();
            if (text === '') return;

            // Add player message to UI
            addMessage(text, 'player-msg');
            decreeInput.value = '';

            // Simulate processing
            addMessage("Processando decreto...", 'system-msg');

            // TODO: Here we will make a fetch() call to the Python FastAPI backend
            // For now, mock a response after a delay
            setTimeout(() => {
                // Remove the processing message
                chatHistory.removeChild(chatHistory.lastChild);

                // Mock agent response
                addMessage(
                    "Entendido, Soberano. Vou alocar recursos para nossas forças de reconhecimento. Isso pode atrasar o desenvolvimento civil.",
                    'agent-msg',
                    "Ministro da Defesa (Lealdade: 80, Medo: 20)"
                );
            }, 1500);
        }

        // Event listeners
        sendBtn.addEventListener('click', handleSend);
        decreeInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Prevent new line
                handleSend();
            }
        });
    </script>
</body>
</html>
